name: 7/24 Sentinel Alert Engine
on:
  schedule:
    - cron: '*/30 * * * *' # Her 30 dakikada bir kesin kontrol
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install pandas numpy yfinance requests
      - name: Run Alert Logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python app.py # Burada app.py'yi direkt script olarak calistirir
